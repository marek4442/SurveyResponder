name: Build And Push Docker Image

on:
  push:
    branches: ["main"]
permissions:
  contents: read
  packages: write

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t surveyresponder:test .
      - name: Run Tests
        run: |
          docker run --rm surveyresponder:test python - <<EOF
          import SurveyResponder
          print("SurveyResponder module imported successfully.")
          EOF
      - name: Verify CLI Exists
        run: |
          docker run --rm surveyresponder:test python cli.py --help
     
      - name: Verify Start Script Execution
        run: |
          timeout 30s docker run --rm -p 11434:11434 surveyresponder:test bash start.sh || [ $? -eq 124 ] 
     
      - name: Verify CLI Starts
        run: |
          curl -fsSL https://ollama.ai/install.sh |  sh
          ollama serve > /dev/null 2>&1 &
          sleep 10
          until curl -s http://localhost:11434/api/tags > /dev/null; do 
            sleep 2; 
          done
          ollama pull tinydolphin
          timeout 60s docker run --rm --network host surveyresponder:test bash -c "python cli.py run --persona persona.json --questions questions.txt --model tinydolphin --num-responses 1 --temperature 1.0 -response-options 'Yes,No,Maybe' --output test_results.csv && rm test_results.csv" || [ $? -eq 124 ]
  
        
        
      

  docker:
    needs: docker-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t surveyresponder:test .
      - name: Tag and push
        run: |
          docker tag surveyresponder:test ${{secrets.DOCKER_USERNAME}}/surveyresponder:latest
          docker tag surveyresponder:test ${{secrets.DOCKER_USERNAME}}/surveyresponder:${{github.sha}}
          docker push ${{secrets.DOCKER_USERNAME}}/surveyresponder:${{github.sha}}
          docker push ${{secrets.DOCKER_USERNAME}}/surveyresponder:latest
       




      
    

